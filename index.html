<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Accent Lab">
<title>Accent Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column. Home = grid of sound tiles; Sound = practice card on top, then how-to, GIF slot, pairs, and future score/tutor slots. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#141B26; --muted:#5A6577; --line:#DCE1E8;
  --listen:#3348C8; --listen-soft:#E6E9FA;
  --rec:#D93A3F; --rec-soft:#FBE7E7;
  --good:#1E8A57; --mid:#B7791F; --weak:#C2413F;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", -apple-system, system-ui, sans-serif;
  --ipa:"Noto Sans", "Lucida Grande", "Segoe UI", sans-serif;
  --r:14px;
  --m-line:#6B7688; --m-skin:#F3DDD0; --m-tongue:#E58A8F; --m-tongue-line:#B85C62; --m-tooth:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F141C; --surface:#18202B; --ink:#E9EDF3; --muted:#9AA6B8; --line:#2A3442;
    --listen:#8D9CFF; --listen-soft:#232B4A; --rec:#FF6B6F; --rec-soft:#3A1F23;
    --good:#4CC88A; --mid:#E3A94A; --weak:#F07775; color-scheme:dark;
    --m-line:#9AA6B8; --m-skin:#4A3A35; --m-tongue:#C25E66; --m-tongue-line:#E58A8F; --m-tooth:#E9EDF3; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--listen);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
header.top{display:flex;align-items:center;gap:12px;padding-block:8px 16px}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;margin:0}
.brand small{display:block;font:400 .8rem/1.2 var(--body);color:var(--muted);letter-spacing:0}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
h2{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 8px;text-wrap:balance}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.ipa{font-family:var(--ipa)}

/* Home */
.intro{color:var(--muted);margin:0 0 16px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tile .sym{font-family:var(--ipa);font-size:2rem;line-height:1.1}
.tile .name{font-weight:700}
.tile .ex{color:var(--muted);font-size:.9rem}
.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.good{background:var(--good)} .dot.mid{background:var(--mid)} .dot.weak{background:var(--weak)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Sound page */
.hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.hero .sym{font-family:var(--ipa);font-size:3.2rem;line-height:1}
.hero .name{font-family:var(--display);font-size:1.4rem;font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.practice{border-width:2px;border-color:var(--ink)}
.target{font-family:var(--display);font-size:1.7rem;line-height:1.25;font-weight:500;margin:6px 0 2px;text-wrap:balance}
.target mark{background:var(--listen-soft);color:inherit;border-radius:4px;padding:0 2px}
.counter{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav{display:flex;gap:6px}
.icon{border:1px solid var(--line);background:transparent;border-radius:10px;width:40px;height:40px;font-size:1.1rem}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:14px 10px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.btn-listen{background:var(--listen-soft);color:var(--listen)}
.btn-rec{background:var(--rec);color:#fff}
.btn-rec.on{animation:pulse 1.2s ease-in-out infinite}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--rec-soft)}}
@media (prefers-reduced-motion:reduce){.btn-rec.on{animation:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.toggle{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem}
canvas.meter{width:100%;height:36px;display:block;margin-top:10px;border-radius:8px;background:var(--bg)}
.note{font-size:.88rem;color:var(--muted);margin:8px 0 0}
.warn{background:var(--rec-soft);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-top:10px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.rate button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 4px;font-size:.88rem}
.rate button[aria-pressed="true"].weak{background:var(--weak);border-color:var(--weak);color:#fff}
.rate button[aria-pressed="true"].mid{background:var(--mid);border-color:var(--mid);color:#fff}
.rate button[aria-pressed="true"].good{background:var(--good);border-color:var(--good);color:#fff}

.howto{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:600px){.howto{grid-template-columns:200px minmax(0,1fr)}}
.gif{aspect-ratio:1;max-width:100%;border-radius:12px;background:repeating-linear-gradient(45deg,var(--bg) 0 10px,var(--surface) 10px 20px);border:1px dashed var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--muted);font-size:.82rem;overflow:hidden}
.gif img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.gif code{font-size:.78rem;word-break:break-all}
.gif.mouthbox{background:var(--bg);border:1px solid var(--line);padding:0;cursor:pointer}
#gifEmpty{width:100%;height:100%}
svg.mouth{width:100%;height:100%;display:block}
.m-line{fill:none;stroke:var(--m-line);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.m-skin{fill:var(--m-skin);stroke:var(--m-line);stroke-width:1.2;stroke-linejoin:round}
.m-tongue{fill:var(--m-tongue);stroke:var(--m-tongue-line);stroke-width:1.2}
.m-tooth{fill:var(--m-tooth);stroke:var(--m-line);stroke-width:1}
.m-air{fill:none;stroke:var(--listen);stroke-width:2;stroke-dasharray:4 3}
.m-air-fill{fill:var(--listen)}
.m-voice{fill:none;stroke:var(--rec);stroke-width:1.6;stroke-linejoin:round}
.m-label{font:600 7px var(--body);fill:var(--muted)}
.m-cap{font:700 11px var(--body);fill:var(--ink)}
.real{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
.real a{color:var(--listen);font-weight:700}
.steps{margin:0;padding-left:1.2em}
.steps li{margin-bottom:6px}
.avoid{margin-top:8px;font-size:.92rem}
.avoid b{color:var(--weak)}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pair{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair button{flex:1;border:0;background:transparent;padding:10px 6px;font-weight:700}
.pair button+button{border-left:1px solid var(--line)}
.pair button:active{background:var(--listen-soft)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.items button{width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.items button[aria-current="true"]{border-color:var(--ink);border-width:2px}
.items .dot{flex:none}
.soon{border-style:dashed;background:transparent}
.soon .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);margin-left:6px;vertical-align:middle}
.brand{flex:1}
.gear{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;font-size:1.1rem;flex:none}

/* Scores (step 2) */
.good-t{color:var(--good)} .mid-t{color:var(--mid)} .weak-t{color:var(--weak)}
.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:4px}
.total{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.total b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1}
.total span{font-size:.72rem;color:var(--muted)}
.focus{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.focus.good{background:color-mix(in srgb,var(--good) 14%,transparent)} .focus.mid{background:color-mix(in srgb,var(--mid) 16%,transparent)} .focus.weak{background:var(--rec-soft)}
.words{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:12px}
.word{min-width:0}
.word .w{font-weight:700;font-size:1.05rem}
.word .err{font-size:.72rem;color:var(--weak);margin-left:4px}
.phs{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.ph{font-family:var(--ipa);font-size:.82rem;border-radius:6px;padding:1px 5px;color:#fff;line-height:1.5}
.ph.good{background:var(--good)} .ph.mid{background:var(--mid)} .ph.weak{background:var(--weak)}
.ph small{opacity:.85;font-family:var(--body);margin-left:3px}
.ph.target{outline:2px solid var(--ink);outline-offset:1px}

/* Settings */
.field{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.field input,.field select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1}
.update{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:999px;font-size:.92rem;z-index:21;display:flex;align-items:center;gap:12px;white-space:nowrap}
.update button{border:0;border-radius:999px;background:var(--listen);color:#fff;font-weight:700;padding:8px 14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:20}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="back" id="backBtn" hidden>← Sounds</button>
    <h1 class="brand">Accent Lab <small>American English pronunciation</small></h1>
    <button class="gear" id="gearBtn" aria-label="Settings">⚙</button>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="update" id="update" role="status" hidden>A new version is ready <button id="updateBtn">Update</button></div>

<script>
/* ---------- Content: the sounds ---------- */
const SOUNDS = [
 {id:"th-voiceless", sym:"θ", name:"th as in think", ex:"think, three, bath",
  steps:["Put the tip of your tongue lightly between your teeth, or just behind the top ones.","Blow air out over the tongue. Keep your voice off, like a soft hiss.","Keep the tongue relaxed and let the air flow. Don't press and pop it."],
  avoid:"Don't let it turn into s (sink) or t (tink).",
  pairs:[["think","sink"],["three","tree"],["mouth","mouse"],["thank","tank"]],
  items:["think","three","month","bathroom","Thank you for the birthday gift.","I think three thousand is enough."]},
 {id:"th-voiced", sym:"ð", name:"th as in this", ex:"this, the, mother",
  steps:["Same tongue position as θ: tip lightly between your teeth.","Now turn your voice on. Put a finger on your throat and feel it buzz.","Keep it short and soft in little words like the and this."],
  avoid:"Don't let it turn into d (dis) or z (zis).",
  pairs:[["they","day"],["then","den"],["breathe","breeze"],["those","doze"]],
  items:["the","this","mother","together","This is the other brother.","They gathered there together."]},
 {id:"r", sym:"ɹ", name:"American r", ex:"red, car, very",
  steps:["Pull your tongue back and curl the tip up slightly, or bunch the middle of the tongue up.","Don't let the tongue touch the roof of your mouth.","Round your lips a little and keep your voice on. The sound is smooth, with no tap or roll."],
  avoid:"Don't tap or roll it. Pronounce the r at the end of words too: car, here, better.",
  pairs:[["right","light"],["red","led"],["rock","lock"],["berry","belly"]],
  items:["red","right","car","very","Really, the red car is right there.","Rory wrote a very rare report."]},
 {id:"ae", sym:"æ", name:"a as in cat", ex:"cat, bad, apple",
  steps:["Open your jaw wide, wider than for e in bed.","Push the tongue low and forward. The tip rests behind the bottom teeth.","Spread your lips a little. The sound is between e (bed) and a (father)."],
  avoid:"Don't say it like e (bed): bad and bed must sound different.",
  pairs:[["bad","bed"],["man","men"],["cat","cut"],["had","head"]],
  items:["cat","apple","man","bag","The black cat sat on a mat.","Pam has a bad back after the match."]},
 {id:"ih-ee", sym:"ɪ · i", name:"ship vs sheep", ex:"ship, sheep, live, leave",
  steps:["For i (sheep): smile, tongue high and tense, hold it a little longer.","For ɪ (ship): relax your lips and tongue, drop the tongue a little, keep it short.","Practice switching between the two in pairs."],
  avoid:"Don't use the same vowel for both. Sit and seat should not rhyme.",
  pairs:[["ship","sheep"],["live","leave"],["sit","seat"],["fill","feel"]],
  items:["ship","sheep","live","leave","Did he leave or live here?","This sheep is on the ship."]},
 {id:"uh", sym:"ʌ", name:"u as in cup", ex:"cup, love, son",
  steps:["Relax your whole mouth, jaw half open.","Keep the tongue in the middle, neither high nor low.","Make it short, like a quick 'uh'."],
  avoid:"Don't round your lips into o, and don't open to a wide a.",
  pairs:[["cup","cap"],["hut","hot"],["luck","lock"],["bun","ban"]],
  items:["cup","love","son","money","My son loves summer fun.","Just come up for a cup."]},
 {id:"ah", sym:"ɑ", name:"o as in hot", ex:"hot, father, stop",
  steps:["Open your mouth wide, as for a doctor saying 'say ah'.","Keep the lips relaxed and unrounded.","Let it be a little long and open."],
  avoid:"In American English, hot is not said with round lips like British 'hot'.",
  pairs:[["hot","hut"],["cot","cut"],["not","nut"],["lock","luck"]],
  items:["hot","stop","box","father","Bob got a lot of top jobs.","Stop the clock on the dot."]},
 {id:"schwa", sym:"ə", name:"schwa, the lazy vowel", ex:"about, banana, the",
  steps:["Relax everything: lips, tongue, jaw. Open only a little.","Make it very short and quiet, a tiny 'uh'.","It appears in unstressed syllables, so stress the strong syllable and let the others shrink."],
  avoid:"Don't pronounce every vowel fully. ba-NA-na is closer to bə-NÆ-nə.",
  pairs:[["photograph","photography"],["Canada","Canadian"],["economy","economic"]],
  items:["about","banana","problem","today","I'd like a banana and a coffee.","What do you want to do today?"]},
 {id:"flap-t", sym:"ɾ", name:"flap t as in water", ex:"water, city, better",
  steps:["When t is between two vowels and the next syllable is unstressed, Americans tap it.","Touch the ridge behind your top teeth once, very quickly.","It sounds like a light, fast d: water is close to 'wader'."],
  avoid:"Don't make a strong, airy t in the middle of words like better or city.",
  pairs:[["water","waiter"],["city","pretty"],["better","butter"]],
  items:["water","city","better","a lot of","Get a better bottle of water.","Put it on a little metal plate."]},
 {id:"v-w", sym:"v · w", name:"vest vs west", ex:"very, wine, west",
  steps:["For v: rest your top teeth on your bottom lip and buzz.","For w: round your lips like a small o, with no teeth touching, then open into the vowel.","Look in a mirror: teeth visible for v, none for w."],
  avoid:"Don't use the same sound for both. Wine and vine are different words.",
  pairs:[["vest","west"],["vine","wine"],["veil","whale"],["vet","wet"]],
  items:["very","west","wine","village","We have very wet weather.","Vivian wants a warm vest."]},
 {id:"ng", sym:"ŋ", name:"ng as in sing", ex:"sing, long, thing",
  steps:["Raise the back of your tongue to the soft part at the back of the roof of your mouth.","Let the air come out through your nose.","Stop there. Don't add a hard g or k at the end."],
  avoid:"Don't say 'sing-g' or 'thin-k'.",
  pairs:[["sin","sing"],["thin","thing"],["ran","rang"],["ban","bang"]],
  items:["sing","long","thing","morning","The king is singing a long song.","Bring the thing along."]},
 {id:"dark-l", sym:"ɫ", name:"dark l as in feel", ex:"feel, milk, all",
  steps:["Put the tip of your tongue on the ridge behind your top teeth.","At the same time, pull the back of the tongue up and back.","It sounds deeper, a bit like 'uhl'. Use it at the ends of words and before consonants."],
  avoid:"Don't drop the tongue tip and turn it into a w or o (fee-w, mi-wk).",
  pairs:[["fee","feel"],["sea","seal"],["tie","tile"],["bow","bowl"]],
  items:["feel","milk","all","little","I feel well after a full meal.","Call Bill about the bill."]},
 {id:"oo", sym:"ʊ · u", name:"full vs fool", ex:"look, full, pool",
  steps:["For u (fool): round your lips tightly, tongue high at the back, hold it a little longer.","For ʊ (full): loosen the lips and tongue, keep it short.","Feel the difference in tension between the two."],
  avoid:"Don't make look and Luke sound the same.",
  pairs:[["full","fool"],["pull","pool"],["look","Luke"],["could","cooed"]],
  items:["look","good","pool","should","Look, the pool is full.","Would you put the book down?"]}
];

/* ---------- Mouth diagrams: animated side view (facing left) of lips, teeth, tongue and soft palate ----------
   Each pose lists only what differs from rest: jaw opening 0-1, tongue points (index: [x,y] with the jaw closed),
   lip rounding, lower lip tucked under the teeth (v), extra lip parting, soft palate lowered, voice/air/nasal air on. */
const TONGUE_REST = [[59,111],[68,104],[84,97],[104,93],[124,95],[140,104],[147,122],[148,146],[142,157],[110,150],[80,134],[63,121]];
const JAW_PULL = [1,1,.9,.75,.55,.35,.15,0,0,.6,.9,1];   // how much each tongue point rides along when the jaw opens
const JAW_PIVOT = [150,90], JAW_MAX_DEG = 7;
const POSES = {
  rest:  {},
  th:    {jaw:.3, part:4, air:1, t:{0:[47,105],1:[55,100],2:[76,98],3:[100,96],10:[76,130],11:[52,112]}},
  dh:    {jaw:.3, part:4, air:.6, voice:1, t:{0:[47,105],1:[55,100],2:[76,98],3:[100,96],10:[76,130],11:[52,112]}},
  r:     {jaw:.2, round:.4, voice:1, t:{11:[60,114],0:[72,93],1:[80,101],2:[92,99],3:[108,91],4:[126,92],5:[140,102],6:[150,122],7:[151,146]}},
  ae:    {jaw:1, voice:1, t:{0:[60,113],1:[68,108],2:[84,104],3:[104,103],4:[124,104],5:[139,110],6:[147,124]}},
  ee:    {jaw:.05, voice:1, t:{0:[60,110],1:[67,100],2:[80,90],3:[98,85],4:[120,88],5:[138,100],6:[146,120]}},
  ih:    {jaw:.25, voice:1, t:{1:[68,102],2:[82,94],3:[100,90],4:[120,92],5:[138,102]}},
  uh:    {jaw:.5, voice:1, t:{1:[68,105],2:[84,100],3:[104,97],4:[124,98],5:[140,106]}},
  ah:    {jaw:1, voice:1, t:{0:[61,113],1:[70,110],2:[86,108],3:[106,106],4:[126,102],5:[142,106],6:[152,124],7:[152,146]}},
  schwa: {jaw:.3, voice:1, t:{3:[104,95]}},
  flap:  {jaw:.3, voice:1, t:{0:[62,87],1:[70,95],2:[84,97],11:[62,104]}},
  v:     {jaw:.2, vlip:1, air:1, voice:1},
  w:     {jaw:.15, round:1, voice:1, t:{3:[106,90],4:[124,86],5:[140,98]}},
  ng:    {jaw:.15, velum:1, nasal:1, voice:1, t:{4:[130,88],5:[143,94]}},
  darkl: {jaw:.2, voice:1, t:{0:[62,88],11:[60,100],1:[70,96],2:[86,102],3:[104,100],4:[124,90],5:[140,98],6:[150,120]}},
  oo:    {jaw:.1, round:1, voice:1, t:{2:[84,98],3:[104,90],4:[124,85],5:[140,96],6:[146,120]}},
  uu:    {jaw:.25, round:.5, voice:1, t:{3:[104,93],4:[122,90],5:[139,100]}}
};
// seq: one or two target poses with an optional caption; keys: explicit [time, pose] timeline (flap t)
const MOUTH = {
  "th-voiceless": {seq:[["th"]]}, "th-voiced": {seq:[["dh"]]}, "r": {seq:[["r"]]}, "ae": {seq:[["ae"]]},
  "ih-ee": {seq:[["ee","sheep /i/"],["ih","ship /ɪ/"]]}, "uh": {seq:[["uh"]]}, "ah": {seq:[["ah"]]}, "schwa": {seq:[["schwa"]]},

  const m = MOUTH[id]; if (!m) return "";

  const rot = (p, deg) => { const a = deg * Math.PI / 180, dx = p[0] - JAW_PIVOT[0], dy = p[1] - JAW_PIVOT[1];
    return [JAW_PIVOT[0] + dx*Math.cos(a) - dy*Math.sin(a), JAW_PIVOT[1] + dx*Math.sin(a) + dy*Math.cos(a)]; };

    const n = pts.length, P = i => pts[(i + n) % n];
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < n; i++){
      const p0 = P(i-1), p1 = P(i), p2 = P(i+1), p3 = P(i+2);

    upper: `${f(-5 * p.round)} ${f(p.round)}`,

  }).join("") : "";

  return `<svg viewBox="0 0 200 200" class="mouth" role="img" aria-label="Side view of the mouth showing tongue and lip position">
    <defs><marker id="m-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-air-fill"/></marker></defs>

    <path class="m-skin" d="${main.velum}">${anim("d","velum")}</path>
    <path class="m-tongue" d="${main.tongue}">${anim("d","tongue")}</path>
    <path class="m-tooth" d="M52 84L56 86L57 92C57 98 55 103 53 106L50 106C50 100 50 92 52 84Z"/>
    <g transform="rotate(${main.jaw})">${anim("transform","jaw",'type="rotate"')}
      <path class="m-tooth" d="M54 108L57 108C59 114 60 120 60 126L55 127C55 120 54 114 54 108Z"/>

const rec = { stream:null, mr:null, chunks:[], url:null, ctx:null, raf:0, timer:0 };

async function startRec(btn, canvas, onDone){
  try {
    rec.stream = await navigator.mediaDevices.getUserMedia({audio:true});
  } catch(e){
    showWarn("Microphone access was blocked. On iPhone: Settings → Safari → Microphone → Allow, then reload."); return;
  }
  rec.chunks = [];
  const type = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  rec.mr = type ? new MediaRecorder(rec.stream, {mimeType:type}) : new MediaRecorder(rec.stream);
  rec.mr.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  rec.mr.onstop = () => {
    const blob = new Blob(rec.chunks, {type: rec.mr.mimeType || "audio/mp4"});
    if (rec.url) URL.revokeObjectURL(rec.url);
    rec.url = URL.createObjectURL(blob);
    rec.stream.getTracks().forEach(t => t.stop());
    stopMeter(canvas);
    onDone(blob);
  };
  rec.mr.start();
  btn.classList.add("on"); btn.textContent = "■ Stop";
  startMeter(canvas);
  rec.timer = setTimeout(() => stopRec(btn), 15000);
}
function stopRec(btn){
  clearTimeout(rec.timer);
  if (rec.mr && rec.mr.state === "recording") rec.mr.stop();
  btn.classList.remove("on"); btn.textContent = "● Record";
}
function startMeter(canvas){
  try {
    rec.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = rec.ctx.createMediaStreamSource(rec.stream);
    const an = rec.ctx.createAnalyser(); an.fftSize = 512; src.connect(an);
    const data = new Uint8Array(an.fftSize);
    const g = canvas.getContext("2d");
    const color = getComputedStyle(document.documentElement).getPropertyValue("--rec").trim();
    const hist = [];
    const draw = () => {
      an.getByteTimeDomainData(data);
      let peak = 0; for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
      hist.push(peak / 128); if (hist.length > 80) hist.shift();
      const w = canvas.width = canvas.clientWidth * devicePixelRatio, h = canvas.height = canvas.clientHeight * devicePixelRatio;
      g.clearRect(0,0,w,h); g.fillStyle = color;
      const bw = w / 80;
      hist.forEach((p,i) => { const bh = Math.max(2, p * h * 1.6); g.fillRect(i*bw, (h-bh)/2, bw*0.6, Math.min(h,bh)); });
      rec.raf = requestAnimationFrame(draw);
    };
    canvas.hidden = false; draw();
  } catch(e) {}
}
function stopMeter(canvas){ cancelAnimationFrame(rec.raf); if (rec.ctx) rec.ctx.close().catch(()=>{}); rec.ctx = null; setTimeout(()=>{ canvas.hidden = true; }, 300); }

/* ---------- Step 2: Azure Pronunciation Assessment ----------
   iPhone records AAC (audio/mp4), which the REST API won't take, so decode it and re-encode as 16 kHz mono WAV first. */
async function toWav16k(blob){
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  let audio;
  try {
    const buf = await blob.arrayBuffer();
    audio = await new Promise((res, rej) => { const p = ctx.decodeAudioData(buf, res, rej); if (p && p.then) p.then(res, rej); });
  } finally { if (ctx.close) ctx.close().catch(()=>{}); }
  const n = Math.min(audio.length, audio.sampleRate * 30), chs = audio.numberOfChannels;
  const mono = new Float32Array(n);
  for (let c = 0; c < chs; c++){ const d = audio.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / chs; }
  // Downsample to 16 kHz by averaging each window (a simple low-pass)
  const ratio = audio.sampleRate / 16000, len = Math.floor(n / ratio);
  const pcm = new Int16Array(len);
  for (let i = 0; i < len; i++){
    const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.min(n, Math.floor((i + 1) * ratio)));
    let sum = 0; for (let j = a; j < b; j++) sum += mono[j];
    const v = Math.max(-1, Math.min(1, sum / (b - a)));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7FFF;
  }
  const out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  str(0,"RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); str(8,"WAVE"); str(12,"fmt ");
  out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,1,true);
  out.setUint32(24,16000,true); out.setUint32(28,32000,true); out.setUint16(32,2,true); out.setUint16(34,16,true);
  str(36,"data"); out.setUint32(40, pcm.length * 2, true);
  pcm.forEach((s, i) => out.setInt16(44 + i * 2, s, true));
  return new Blob([out], {type:"audio/wav"});
}

async function assessPronunciation(referenceText, blob){
  const wav = await toWav16k(blob);
  const params = { ReferenceText:referenceText, GradingSystem:"HundredMark", Granularity:"Phoneme", Dimension:"Comprehensive", EnableMiscue:true };
  const url = `https://${encodeURIComponent(cfg.azureRegion.trim())}.stt.speech.microsoft.com/speech/recognition/conversation/cognitiveservices/v1?language=en-US&format=detailed`;
  let r;

      "Ocp-Apim-Subscription-Key": cfg.azureKey.trim(),
      "Content-Type": "audio/wav; codecs=audio/pcm; samplerate=16000",
      "Pronunciation-Assessment": btoa(unescape(encodeURIComponent(JSON.stringify(params)))),
      "Accept": "application/json" }});
  } catch(e){ throw new Error("Couldn't reach Azure. Check your internet connection and the region in Settings."); }

const IPA = {aa:"ɑ",ae:"æ",ah:"ʌ",ao:"ɔ",aw:"aʊ",ax:"ə",ay:"aɪ",b:"b",ch:"tʃ",d:"d",dh:"ð",eh:"ɛ",er:"ɝ",ey:"eɪ",f:"f",g:"g",h:"h",hh:"h",ih:"ɪ",iy:"i",jh:"dʒ",k:"k",l:"l",m:"m",n:"n",ng:"ŋ",ow:"oʊ",oy:"ɔɪ",p:"p",r:"ɹ",s:"s",sh:"ʃ",t:"t",th:"θ",uh:"ʊ",uw:"u",v:"v",w:"w",y:"j",z:"z",zh:"ʒ"};
// Which scored phonemes belong to each sound page (Azure has no separate flap, so flap t is scored as t)
const TARGET = {"th-voiceless":["θ"],"th-voiced":["ð"],"r":["ɹ","ɝ"],"ae":["æ"],"ih-ee":["ɪ","i"],"uh":["ʌ"],"ah":["ɑ"],"schwa":["ə"],"flap-t":["t","ɾ"],"v-w":["v","w"],"ng":["ŋ"],"dark-l":["l","ɫ"],"oo":["ʊ","u"]};

function parseAssessment(j){
  const best = j.NBest && j.NBest[0];
  if (j.RecognitionStatus !== "Success" || !best) throw new Error("Azure couldn't hear any speech. Hold the phone closer and try again.");
  const pa = o => o.PronunciationAssessment || o;
  const round = v => Math.round(v || 0);
  return {
    pron: round(pa(best).PronScore), accuracy: round(pa(best).AccuracyScore),
    fluency: round(pa(best).FluencyScore), completeness: round(pa(best).CompletenessScore),
    heard: j.DisplayText || "",
    words: (best.Words || []).map(w => ({
      word: w.Word, score: round(pa(w).AccuracyScore), error: pa(w).ErrorType || "None",
      phonemes: (w.Phonemes || []).map(p => ({ ph: IPA[String(p.Phoneme).toLowerCase()] || p.Phoneme, score: round(pa(p).AccuracyScore) }))
    }))
  };
}

// Plain-text summary of a result; used by "Copy for Claude" now and by the AI tutor in step 3
function scoreSummary(res){
  const lines = [`Azure scores (0-100): overall ${res.pron}, accuracy ${res.accuracy}, fluency ${res.fluency}, completeness ${res.completeness}.`];
  res.words.forEach(w => lines.push(`- "${w.word}": ${w.score}${w.error !== "None" ? ` (${w.error})` : ""}; sounds: ${w.phonemes.map(p => `/${p.ph}/ ${p.score}`).join(", ")}`));
  return lines.join("\n");
}

/* ---------- Step 3: AI tutor via OpenRouter. It only coaches from the Azure scores (text), it never scores. ---------- */
const TUTOR_SYSTEM = `You are a friendly American English pronunciation coach. The learner practices on a phone. Microsoft Azure has already scored their recording: trust the numbers, don't re-score, only coach.
Focus on the weakest sound, preferring the sound of the current practice page if it scored below 80.
Reply with JSON only, no other text, in exactly this shape:
{"tip": "...", "drills": [{"say": "...", "why": "..."}]}
- tip: 2-3 short sentences on tongue, lips and jaw for that sound, in plain words. You may use the IPA symbol once.
- drills: 2 or 3 items. "say" is something to read aloud: a minimal pair, a few words, or a short sentence (max 10 words). "why" is under 12 words.`;

async function askTutor(s, item, res){
  const user = `Practice page: /${s.sym}/ (${s.name}).\nTarget text: "${item}"\nWhat Azure heard: "${res.heard}"\n${scoreSummary(res)}`;
  let r;
  try {
    r = await fetch("https://openrouter.ai/api/v1/chat/completions", { method:"POST",
      headers:{ "Authorization": `Bearer ${cfg.orKey.trim()}`, "Content-Type": "application/json", "X-Title": "Accent Lab" },
      body: JSON.stringify({ model: cfg.orModel, max_tokens: 500, temperature: 0.4,
        messages: [{ role:"system", content:TUTOR_SYSTEM }, { role:"user", content:user }] }) });
  } catch(e){ throw new Error("Couldn't reach OpenRouter. Check your internet connection."); }
  if (r.status === 401) throw new Error("OpenRouter didn't accept the key. Check it in Settings.");
  if (r.status === 402) throw new Error("The OpenRouter key is out of credit or hit its limit.");
  if (r.status === 429) throw new Error("Too many requests right now. Wait a moment and try again.");
  if (!r.ok) throw new Error(`OpenRouter returned an error (${r.status}). Try again or pick another model in Settings.`);
  const j = await r.json();
  const text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
  try {
    const o = JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1));
    if (typeof o.tip === "string" && Array.isArray(o.drills)) return { tip:o.tip, drills:o.drills.filter(d => d && d.say).slice(0,3) };
  } catch(e) {}
  if (!text.trim()) throw new Error("The tutor sent an empty answer. Try again.");
  return { tip:text.trim(), drills:[] };   // model ignored the format: show its words as they are
}

  window.scrollTo(0,0);
}

/* ---------- Sound page ---------- */
function renderSound(s){
  $("#backBtn").hidden = false;
  let idx = 0;
  $("#app").innerHTML = `
    <div class="hero"><span class="sym">${s.sym}</span><span class="name">${esc(s.name)}</span></div>
    <div class="stack">
      <section class="card practice" aria-label="Practice">
        <div class="counter"><span class="label" id="count"></span>
          <div class="nav"><button class="icon" id="prev" aria-label="Previous">‹</button><button class="icon" id="next" aria-label="Next">›</button></div></div>
        <p class="target" id="target"></p>
        <div class="controls">
          <button class="btn btn-listen" id="listen">▶ Listen</button>
          <button class="btn btn-rec" id="rec">● Record</button>
          <button class="btn btn-ghost" id="mine" disabled>Play mine</button>
          <button class="btn btn-ghost" id="compare" disabled>Model, then me</button>
        </div>
        <canvas class="meter" id="meter" hidden></canvas>
        <div class="row">
          <label class="toggle"><input type="checkbox" id="slow"> Slow voice</label>
          <label class="toggle" id="uploadWrap" hidden>or <input type="file" id="upload" accept="audio/*"></label>
        </div>
        <div class="warn" id="warn" hidden></div>
        <audio id="player" playsinline></audio>
        <div style="margin-top:14px"><span class="label">How did it sound?</span>
          <div class="rate" id="rate">${RATES.map(([k,t])=>`<button class="${k}" data-r="${k}" aria-pressed="false">${t}</button>`).join("")}</div></div>
      </section>

      <section class="card" aria-label="Pronunciation score" aria-live="polite">
        <h2>Pronunciation score</h2>
        <div id="score"></div>
      </section>

      <section class="card">
        <h2>How to make it</h2>
        <div class="howto">
          <div style="min-width:0">
            <div class="gif mouthbox" id="gif" aria-label="Tap to pause or play the animation">
              <img alt="Animation of tongue and lip position for ${esc(s.name)}" src="gifs/${s.id}.gif" hidden>
              <div id="gifEmpty">${mouthSVG(s.id, reduceMotion)}</div>
            </div>
            <p class="note">${reduceMotion ? "" : "Tap the picture to pause. "}<span style="color:var(--listen)">Blue arrow</span>: air. <span style="color:var(--rec)">Red zigzag</span>: voice on.</p>
          </div>
          <div style="min-width:0">
            <ol class="steps">${s.steps.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
            <p class="avoid"><b>Avoid:</b> ${esc(s.avoid)}</p>
            ${REAL[s.id] ? `<p class="label" style="margin:14px 0 0">Watch a real speaker (MRI scan)</p>
            <ul class="real">${REAL[s.id].map(([label, url]) => `<li><a href="${url}" target="_blank" rel="noopener">▶ ${esc(label)} ↗</a></li>`).join("")}</ul>
            <p class="note">Videos by Seeing Speech, University of Glasgow (CC BY-NC-ND 4.0). They open on their site.${/^(ae|ih-ee|uh|ah|schwa|oo)$/.test(s.id) ? " Vowels there are reference vowels, close to but not exactly American English." : ""}</p>` : ""}
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Hear the difference</h2>
        <p class="note" style="margin:0 0 10px">Tap each word. The two should sound different.</p>
        <div class="pairs">${s.pairs.map(p=>`<div class="pair">${p.map(w=>`<button data-say="${esc(w)}">${esc(w)}</button>`).join("")}</div>`).join("")}</div>
      </section>

      <section class="card">
        <h2>All practice items</h2>
        <ul class="items" id="items"></ul>
      </section>

      <section class="card" aria-label="AI tutor" aria-live="polite">
        <h2>AI tutor</h2>
        <div id="tutor"></div>
        <div class="row"><button class="btn btn-listen" id="askTutor">Get a tip</button><button class="btn btn-ghost" id="copy">Copy for Claude</button></div>
      </section>
    </div>`;

  // GIF slot: show the animation if the file exists, otherwise the placeholder
  const img = $("#gif img");
  img.onload = () => { img.hidden = false; $("#gifEmpty").hidden = true; };
  img.onerror = () => { img.remove(); };
  $("#gif").onclick = () => { const svg = $("#gif svg"); if (!svg || !svg.pauseAnimations) return;
    svg.animationsPaused() ? svg.unpauseAnimations() : svg.pauseAnimations(); };

  const player = $("#player");
  const problem = micProblem();
  if (problem){ showWarn(problem); $("#uploadWrap").hidden = false; }

  function paint(){
    const item = s.items[idx];
    $("#count").textContent = `Item ${idx+1} of ${s.items.length}`;
    $("#target").textContent = item;
    const r = getRating(s.id, idx);
    $("#rate").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === r)));
    $("#items").innerHTML = s.items.map((t,i)=>`<li><button data-i="${i}" aria-current="${i===idx}"><span>${esc(t)}</span><span class="dot ${getRating(s.id,i)||""}"></span></button></li>`).join("");
    $("#items").querySelectorAll("[data-i]").forEach(b => b.onclick = () => { idx = +b.dataset.i; resetTake(); paint(); window.scrollTo({top:0,behavior:"smooth"}); });
  }
  let take = 0, lastResult = null;   // take guards against a slow score landing on a different item
  function resetTake(){ take++; lastResult = null; player.removeAttribute("src"); $("#mine").disabled = $("#compare").disabled = true; paintScore(); paintTutor(); }
  function haveTake(url, blob){ player.src = url; $("#mine").disabled = $("#compare").disabled = false; scoreTake(blob); }

  function paintScore(state){
    const box = $("#score");
    if (!azureReady()){ box.innerHTML = `<p class="note">Add your Azure key in <a href="#settings">Settings</a> to get a score for every sound after each recording.</p>`; return; }
    if (!state){ box.innerHTML = `<p class="note">Record yourself and your scores will appear here: every word and sound, with weak sounds in red.</p>`; return; }
    if (state.loading){ box.innerHTML = `<p class="note">Scoring…</p>`; return; }
    if (state.error){ box.innerHTML = `<div class="warn">${esc(state.error)}</div>`; return; }
    const res = state.result, targets = TARGET[s.id] || [];
    const hits = res.words.flatMap(w => w.phonemes).filter(p => targets.includes(p.ph));
    const weak = res.words.flatMap(w => w.phonemes.filter(p => p.score < 60).map(p => ({...p, word:w.word}))).sort((a,b) => a.score - b.score);
    let focus = "";
    if (hits.length){
      const avg = Math.round(hits.reduce((t,p) => t + p.score, 0) / hits.length);
      focus = `<div class="focus ${band(avg)}">Your <span class="ipa">/${esc(targets.filter(t => hits.some(h => h.ph === t)).join("/ /"))}/</span>: <b>${avg}</b> · ${BAND_TEXT[band(avg)]}</div>`;
    }
    box.innerHTML = `
      <div class="totals">${[["Overall",res.pron],["Accuracy",res.accuracy],["Fluency",res.fluency],["Complete",res.completeness]].map(([k,v]) =>
        `<div class="total"><b class="${band(v)}-t">${v}</b><span>${k}</span></div>`).join("")}</div>
      ${focus}
      <div class="words">${res.words.map(w => `
        <div class="word"><span class="w ${band(w.score)}-t">${esc(w.word)}</span>${w.error !== "None" ? `<span class="err">${esc(w.error === "Omission" ? "missed" : w.error === "Insertion" ? "extra" : w.error.toLowerCase())}</span>` : ""}
          <div class="phs">${w.phonemes.map(p => `<span class="ph ${band(p.score)}${targets.includes(p.ph) ? " target" : ""}">${esc(p.ph)}<small>${p.score}</small></span>`).join("")}</div></div>`).join("")}
      </div>
      <p class="note">${weak.length ? `Weakest sounds: ${weak.slice(0,4).map(p => `<span class="ipa">/${esc(p.ph)}/</span> in “${esc(p.word)}” (${p.score})`).join(", ")}.` : "No weak sounds in this take. Nice."} Outlined = this page's sound.</p>`;
  }
  async function scoreTake(blob){
    if (!azureReady() || !blob) return;
    const mine = ++take, item = s.items[idx];
    lastResult = null; paintScore({loading:true}); paintTutor();
    try {
      const result = await assessPronunciation(item, blob);
      if (mine !== take) return;
      lastResult = result; paintScore({result}); paintTutor();
    } catch(e){ if (mine === take) paintScore({error: e.message || "Scoring failed. Try again."}); }
  }

  function paintTutor(state){
    const box = $("#tutor"), btn = $("#askTutor");
    btn.disabled = !tutorReady() || !lastResult || !!(state && state.loading);
    btn.textContent = state && state.result ? "Another tip" : "Get a tip";
    if (!tutorReady()){ box.innerHTML = `<p class="note">Add your OpenRouter key in <a href="#settings">Settings</a> and the tutor will read your scores and suggest a fix and drills.</p>`; return; }
    if (!state){ box.innerHTML = `<p class="note">${lastResult ? "Tap Get a tip for advice on your weakest sound." : "Record yourself first. The tutor reads your scores."}</p>`; return; }
    if (state.loading){ box.innerHTML = `<p class="note">Thinking…</p>`; return; }
    if (state.error){ box.innerHTML = `<div class="warn">${esc(state.error)}</div>`; return; }
    const t = state.result, model = (MODELS.find(m => m[0] === cfg.orModel) || [0, cfg.orModel])[1];
    box.innerHTML = `<p style="margin:0">${esc(t.tip)}</p>
      ${t.drills.length ? `<ul class="items" style="margin-top:12px">${t.drills.map(d => `<li><button data-drill="${esc(d.say)}"><span><b>${esc(d.say)}</b>${d.why ? `<br><span class="note">${esc(d.why)}</span>` : ""}</span><span aria-hidden="true">▶</span></button></li>`).join("")}</ul>
      <p class="note">Tap a drill to hear it, then record it.</p>` : ""}
      <p class="note">Tip by ${esc(model)}.</p>`;
    box.querySelectorAll("[data-drill]").forEach(b => b.onclick = () => speak(b.dataset.drill));
  }
  $("#askTutor").onclick = async () => {
    if (!lastResult) return;
    const mine = take, res = lastResult;
    paintTutor({loading:true});
    try { const result = await askTutor(s, s.items[idx], res); if (mine === take) paintTutor({result}); }
    catch(e){ if (mine === take) paintTutor({error: e.message || "The tutor failed. Try again."}); }
  };

  $("#prev").onclick = () => { idx = (idx - 1 + s.items.length) % s.items.length; resetTake(); paint(); };
  $("#next").onclick = () => { idx = (idx + 1) % s.items.length; resetTake(); paint(); };
  $("#listen").onclick = () => speak(s.items[idx]);
  $("#slow").onchange = e => { slow = e.target.checked; };
  $("#rec").onclick = e => {
    if (problem){ toast("Recording needs the online version. Use the voice memo option for now."); return; }
    const btn = e.currentTarget;
    if (rec.mr && rec.mr.state === "recording") { stopRec(btn); return; }
    speechSynthesis && speechSynthesis.cancel();
    startRec(btn, $("#meter"), blob => haveTake(rec.url, blob));
  };
  $("#upload").onchange = e => { const f = e.target.files[0]; if (f){ if (rec.url) URL.revokeObjectURL(rec.url); rec.url = URL.createObjectURL(f); haveTake(rec.url, f); } };
  $("#mine").onclick = () => { speechSynthesis && speechSynthesis.cancel(); player.currentTime = 0; player.play(); };
  $("#compare").onclick = () => speak(s.items[idx], () => setTimeout(() => { player.currentTime = 0; player.play(); }, 350));
  $("#rate").querySelectorAll("button").forEach(b => b.onclick = () => { setRating(s.id, idx, b.dataset.r); paint(); });
  $("#app").querySelectorAll("[data-say]").forEach(b => b.onclick = () => speak(b.dataset.say));
  $("#copy").onclick = async () => {
    const item = s.items[idx], r = getRating(s.id, idx);
    const text = `I'm practicing American English pronunciation of the sound /${s.sym}/ (${s.name}).\nTarget: "${item}"\nMy own rating: ${r ? RATES.find(x=>x[0]===r)[1] : "not rated yet"}.\n${lastResult ? scoreSummary(lastResult) + "\n" : ""}Please give me one short tip on mouth and tongue position, then 3 quick drills (minimal pairs or short sentences) for this sound.`;
    try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into Claude."); }
    catch(e){ toast("Couldn't copy automatically."); }
  };
  paint();
  paintScore();
  paintTutor();
  window.scrollTo(0,0);
}

/* ---------- Settings page ---------- */
function renderSettings(){
  $("#backBtn").hidden = false;
  $("#app").innerHTML = `
    <div class="stack">
      <section class="card">
        <h2>Azure speech scoring</h2>
        <p class="note" style="margin:0">Paste KEY 1 and the region from your Speech resource (Azure portal → your resource → Keys and Endpoint).</p>
        <label class="field"><span class="label">Key</span>
          <span class="keyrow"><input type="password" id="azKey" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste KEY 1">
          <button class="btn btn-ghost" id="showKey" type="button" style="min-height:0;padding:8px 12px">Show</button></span></label>
        <label class="field"><span class="label">Region</span>
          <input id="azRegion" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="westeurope"></label>
        <div class="controls">
          <button class="btn btn-rec" id="saveAz">Save</button>
          <button class="btn btn-listen" id="checkAz">Check key</button>
        </div>
        <div class="warn" id="warn" hidden></div>
        <p class="note">The key is saved only on this device. It is never put in the app's code or on GitHub.</p>
        <div class="row"><button class="btn btn-ghost" id="clearAz">Remove key from this device</button></div>
      </section>
      <section class="card">
        <h2>AI tutor (OpenRouter)</h2>
        <p class="note" style="margin:0">Paste an OpenRouter key (it starts with sk-or-). Give the key a small credit limit on openrouter.ai so it can never spend more.</p>
        <label class="field"><span class="label">Key</span>
          <span class="keyrow"><input type="password" id="orKey" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-or-…">
          <button class="btn btn-ghost" id="showOr" type="button" style="min-height:0;padding:8px 12px">Show</button></span></label>
        <label class="field"><span class="label">Model</span>
          <select id="orModel">${MODELS.map(([id,name]) => `<option value="${id}">${esc(name)}</option>`).join("")}<option value="custom">Other (type a model ID)</option></select></label>
        <p class="note" id="modelCost"></p>
        <label class="field" id="customWrap" hidden><span class="label">Model ID</span>
          <input id="orCustom" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="for example google/gemini-2.5-flash"></label>
        <div class="controls">
          <button class="btn btn-rec" id="saveOr">Save</button>
          <button class="btn btn-listen" id="checkOr">Check key</button>
        </div>
        <div class="warn" id="orWarn" hidden></div>
        <p class="note">Saved only on this device, like the Azure key.</p>
        <div class="row"><button class="btn btn-ghost" id="clearOr">Remove key from this device</button></div>
      </section>
      <section class="card">
        <h2>App version</h2>
        <p class="note" style="margin:0">You have version ${APP_VERSION}.</p>
        <div class="row"><button class="btn btn-ghost" id="checkUpd">Check for updates</button></div>
      </section>
    </div>`;
  $("#checkUpd").onclick = async () => {
    toast("Checking…");
    const v = await checkForUpdate();
    if (v === null) toast("Couldn't check. Are you online?");
    else if (v === APP_VERSION) toast("You have the newest version.");
    else loadNewest();
  };
  // OpenRouter section
  const orKey = $("#orKey"), orModel = $("#orModel"), orCustom = $("#orCustom");
  const known = MODELS.some(m => m[0] === cfg.orModel);
  orKey.value = cfg.orKey; orModel.value = known ? cfg.orModel : "custom"; orCustom.value = known ? "" : cfg.orModel;
  const syncCustom = () => { $("#customWrap").hidden = orModel.value !== "custom"; const m = MODELS.find(x => x[0] === orModel.value); $("#modelCost").textContent = m ? `Cost: ${m[2]}.` : "Check the price on openrouter.ai/models."; };
  syncCustom(); orModel.onchange = syncCustom;
  const readOr = () => ({ orKey:orKey.value.trim(), orModel: orModel.value === "custom" ? (orCustom.value.trim() || MODELS[0][0]) : orModel.value });
  const orWarn = msg => { const w = $("#orWarn"); w.textContent = msg; w.hidden = !msg; };
  $("#showOr").onclick = e => { const hid = orKey.type === "password"; orKey.type = hid ? "text" : "password"; e.currentTarget.textContent = hid ? "Hide" : "Show"; };
  $("#saveOr").onclick = () => { Object.assign(cfg, readOr()); saveCfg(); toast(cfg.orKey ? "Saved on this device." : "Saved. No key yet."); };
  $("#clearOr").onclick = () => { if (!confirm("Remove the OpenRouter key from this device?")) return; cfg.orKey = ""; saveCfg(); orKey.value = ""; toast("Key removed."); };
  $("#checkOr").onclick = async () => {
    const c = readOr();
    if (!c.orKey){ orWarn("Paste the key first."); return; }
    orWarn(""); toast("Checking…");
    try {
      const r = await fetch("https://openrouter.ai/api/v1/key", { headers:{ "Authorization": `Bearer ${c.orKey}` } });
      if (!r.ok){ orWarn(r.status === 401 ? "OpenRouter didn't accept this key. Copy it again and paste it." : `OpenRouter answered with an error (${r.status}).`); return; }
      const d = (await r.json()).data || {};
      Object.assign(cfg, c); saveCfg();
      const left = d.limit_remaining != null ? ` About $${Number(d.limit_remaining).toFixed(2)} left on its limit.` : (d.limit == null ? " This key has no credit limit; consider setting one on openrouter.ai." : "");
      toast("The key works. Saved."); orWarn(""); if (left) { const w = $("#orWarn"); w.textContent = "✓ Key works." + left; w.hidden = false; }
    } catch(e){ orWarn("Couldn't reach OpenRouter. Check your internet connection."); }
  };

  // Azure section
  const key = $("#azKey"), region = $("#azRegion");
  key.value = cfg.azureKey; region.value = cfg.azureRegion;
  const read = () => ({ azureKey:key.value.trim(), azureRegion:(region.value.trim() || "westeurope").toLowerCase().replace(/\s+/g,"") });
  $("#showKey").onclick = e => { const hid = key.type === "password"; key.type = hid ? "text" : "password"; e.currentTarget.textContent = hid ? "Hide" : "Show"; };
  $("#saveAz").onclick = () => { Object.assign(cfg, read()); saveCfg(); region.value = cfg.azureRegion; toast(cfg.azureKey ? "Saved on this device." : "Saved. No key yet."); };
  $("#clearAz").onclick = () => { if (!confirm("Remove the Azure key from this device?")) return; cfg.azureKey = ""; saveCfg(); key.value = ""; toast("Key removed."); };
  $("#checkAz").onclick = async () => {
    const c = read(), w = $("#warn");
    if (!c.azureKey){ showWarn("Paste the key first."); return; }
    w.hidden = true; toast("Checking…");
    try {
      const r = await fetch(`https://${encodeURIComponent(c.azureRegion)}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:"POST", headers:{ "Ocp-Apim-Subscription-Key": c.azureKey } });
      if (r.ok){ Object.assign(cfg, c); saveCfg(); toast("The key works. Saved."); }
      else showWarn(r.status === 401 ? "Azure says the key doesn't match this region. Check both and try again." : `Azure answered with an error (${r.status}).`);
    } catch(e){ showWarn("Couldn't reach Azure. Check the region spelling (for example westeurope) and your internet connection."); }
  };
  window.scrollTo(0,0);
}

/* ---------- Updates ----------
   Phones keep a saved copy of the page for a while, so the app asks GitHub for the newest copy and offers a reload.
   Bump APP_VERSION with every change that is pushed. */
const APP_VERSION = "2026-10-19.5";
async function latestVersion(){
  const r = await fetch(location.pathname + "?check=" + Date.now(), { cache:"no-store" });
  const m = (await r.text()).match(/const APP_VERSION = "([^"]+)"/);
  return m ? m[1] : null;
}
function loadNewest(){ location.replace(location.pathname + "?v=" + Date.now() + location.hash); }
async function checkForUpdate(){
  try { const v = await latestVersion(); if (v && v !== APP_VERSION) $("#update").hidden = false; return v; } catch(e) { return null; }
}
$("#updateBtn").onclick = loadNewest;
if (/[?&]v=/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);   // tidy the address after an update
if (location.protocol !== "file:"){
  checkForUpdate();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });
}

/* ---------- Router ---------- */
function route(){
  if (rec.mr && rec.mr.state === "recording") rec.mr.stop();
  const id = location.hash.slice(1);
  $("#gearBtn").hidden = id === "settings";
  if (id === "settings") return renderSettings();
  const s = SOUNDS.find(x => x.id === id);
  lastSound = s ? id : "";
  s ? renderSound(s) : renderHome();
}
let lastSound = "";   // so Back from Settings returns to the sound you came from
$("#backBtn").onclick = () => { location.hash = location.hash === "#settings" ? lastSound : ""; };
$("#gearBtn").onclick = () => { location.hash = "settings"; };
window.addEventListener("hashchange", route);
route();
</script>
